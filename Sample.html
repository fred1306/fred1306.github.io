        }

            letter-spacing: 0.3px;
        }
        .header-badge {

            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;

        }
        .header-badge span {
            color: #7fc9ff;
        }

        }

            font-size: 1.1rem;

            box-shadow: 0 0 0 3px rgba(26, 92, 158, 0.10);

            color: #3d526b;
            font-weight: 500;
            margin-left: auto;
            white-space: nowrap;
        }
        .controls .stats strong {
            color: #0b1a2e;
        }

        }

        tbody td .category {

            border-color: #1a5c9e;
            color: #fff;

            tbody td .oem {
                max-width: 100px;
                font-size: 0.65rem;
            }
            .pagination-wrap .pages button {

                font-size: 0.75rem;

        // ────────────────────────────────────────────────────────────────
        // 2.  CSV PARSER  (handles quoted fields with commas)
        // ────────────────────────────────────────────────────────────────
        function parseCSV(text) {
            const lines = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === '\n') {
                        if (current.trim() !== '') lines.push(current);
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            if (current.trim() !== '') lines.push(current);

            if (lines.length === 0) return [];

            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            for (let r = 1; r < lines.length; r++) {
                const values = [];
                let field = '';
                let inQ = false;
                const row = lines[r];
                for (let i = 0; i < row.length; i++) {
                    const ch = row[i];
                    if (inQ) {
                        if (ch === '"' && row[i + 1] === '"') {
                            field += '"';
                            i++;
                        } else if (ch === '"') {
                            inQ = false;
                        } else {
                            field += ch;
                        }
                    } else {
                        if (ch === '"') {
                            inQ = true;
                        } else if (ch === ',') {
                            values.push(field.trim());
                            field = '';
                        } else {
                            field += ch;
                        }
                    }
                }
                values.push(field.trim());
                if (values.length === headers.length) {
                    const obj = {};
                    headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
                    result.push(obj);
                }
            }
            return result;
        }

        // ────────────────────────────────────────────────────────────────
        // 3.  DATA & STATE
        // ────────────────────────────────────────────────────────────────
        const allData = parseCSV(CSV_DATA);
        const PAGE_SIZE = 25;

        let filtered = [...allData];
        let currentPage = 1;

            // apply filters
            const search = searchInput.value.toLowerCase().trim();

            filtered = allData.filter(row => {
                const matchSearch = !search ||
                    row['Brand'].toLowerCase().includes(search) ||
                    row['Part Number'].toLowerCase().includes(search) ||
                    row['Description'].toLowerCase().includes(search) ||
                    row['OEM Numbers'].toLowerCase().includes(search);
                const matchBrand = !brand || row['Brand'] === brand;
                const matchCategory = !category || row['Category'] === category;
                return matchSearch && matchBrand && matchCategory;
            });

            // sort
            filtered.sort((a, b) => {
                const va = (a[sortKey] || '').toLowerCase();
                const vb = (b[sortKey] || '').toLowerCase();
                if (va < vb) return sortAsc ? -1 : 1;
                if (va > vb) return sortAsc ? 1 : -1;
                return 0;
            });

            const total = filtered.length;
            const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, total);
            const pageData = filtered.slice(start, end);

            // stats
            resultStats.innerHTML = `<strong>${total}</strong> results`;
            document.getElementById('totalCount').textContent = allData.length;
            const uniqueBrands = new Set(allData.map(r => r['Brand']));
            brandCountEl.textContent = uniqueBrands.size;

            // table body
            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="no-results">
                            <span class="emoji">🔍</span>
                            No parts found matching your criteria.
                        </div>
                    </td></tr>`;
            } else {
                tbody.innerHTML = pageData.map(row => `
                    <tr>
                        <td><span class="brand-tag">${escHtml(row['Brand'])}</span></td>
                        <td><span class="part-num">${escHtml(row['Part Number'])}</span></td>
                        <td><span class="category">${escHtml(row['Category'])}</span></td>
                        <td class="desc">${escHtml(row['Description'])}</td>
                        <td class="oem">${escHtml(row['OEM Numbers'])}</td>
                    </tr>
                `).join('');
            }

            // pagination info
            paginationInfo.innerHTML =
                `Showing <strong>${total === 0 ? 0 : start + 1}</strong> – <strong>${end}</strong> of <strong>${total}</strong>`;

            // pagination buttons
            let btnHtml = '';
            const maxBtns = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxBtns / 2));
            let endPage = Math.min(totalPages, startPage + maxBtns - 1);
            if (endPage - startPage < maxBtns - 1) {
                startPage = Math.max(1, endPage - maxBtns + 1);
            }

            if (currentPage > 1) {
                btnHtml += `<button data-page="${currentPage - 1}">◀</button>`;
            }
            for (let p = startPage; p <= endPage; p++) {
                btnHtml += `<button data-page="${p}" class="${p === currentPage ? 'active' : ''}">${p}</button>`;
            }
            if (currentPage < totalPages) {
                btnHtml += `<button data-page="${currentPage + 1}">▶</button>`;
            }
            paginationButtons.innerHTML = btnHtml;

            // attach click events to pagination buttons
            paginationButtons.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.dataset.page, 10);
                    if (page >= 1 && page <= totalPages) {
                        currentPage = page;
                        render();
                    }
                });
            });

            // update sort arrows
            document.querySelectorAll('thead th[data-sort]').forEach(th => {
                th.classList.toggle('active', th.dataset.sort === sortKey);
            });
        }

        // ────────────────────────────────────────────────────────────────
        // 5.  HELPERS
        // ────────────────────────────────────────────────────────────────
        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ────────────────────────────────────────────────────────────────
        // 6.  POPULATE FILTERS
        // ────────────────────────────────────────────────────────────────
        function populateFilters() {
            const brands = [...new Set(allData.map(r => r['Brand']))].sort();
            const categories = [...new Set(allData.map(r => r['Category']))].sort();

            brandFilter.innerHTML = `<option value="">All Brands</option>` +
                brands.map(b => `<option value="${b}">${b}</option>`).join('');

            categoryFilter.innerHTML = `<option value="">All Categories</option>` +
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        // ────────────────────────────────────────────────────────────────
        // 7.  EVENTS
        // ────────────────────────────────────────────────────────────────
        searchInput.addEventListener('input', () => { currentPage = 1;
            render(); });
        brandFilter.addEventListener('change', () => { currentPage = 1;
            render(); });
        categoryFilter.addEventListener('change', () => { currentPage = 1;
            render(); });

        document.querySelectorAll('thead th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                if (sortKey === key) {
                    sortAsc = !sortAsc;
                } else {
                    sortKey = key;
                    sortAsc = true;
                }
                currentPage = 1;
                render();
            });
        });

        // ────────────────────────────────────────────────────────────────
        // 8.  INIT
        // ────────────────────────────────────────────────────────────────
        populateFilters();
        render();
    </script>

</body>
</html>
